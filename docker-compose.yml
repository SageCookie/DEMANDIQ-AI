services:
  postgres:
    image: postgres:15-alpine
    container_name: demandiq-postgres
    restart: always
    environment:
      POSTGRES_USER: demandiq_user
      POSTGRES_PASSWORD: demandiq_secure_password_2026
      POSTGRES_DB: demandiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demandiq_user -d demandiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demandiq-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://demandiq_user:demandiq_secure_password_2026@postgres:5432/demandiq
      - MODEL_PATH=/app/models/production/demand_model.joblib
      - METADATA_PATH=/app/models/production/metadata.json
      - DEFAULT_FORECAST_HORIZON=30
      - DEFAULT_SERVICE_LEVEL=0.95
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    command: sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # The API is intentionally private to the Compose network. The dashboard
    # proxies /api, /docs, /redoc, and /openapi.json to this service.
    expose:
      - "8000"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: demandiq-dashboard
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
